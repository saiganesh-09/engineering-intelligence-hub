# Render Blueprint — Engineering Intelligence Hub backend
# Deploy: dashboard.render.com → New → Blueprint → select this repo.
# Creates a Dockerized FastAPI service + managed Postgres (pgvector supported).
services:
  - type: web
    name: eih-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eih-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      # Update after the Vercel frontend URL exists.
      - key: FRONTEND_URL
        value: https://engineering-intelligence-hub.vercel.app
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"

databases:
  - name: eih-db
    plan: free
    postgresMajorVersion: "16"
