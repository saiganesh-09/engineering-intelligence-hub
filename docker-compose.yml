services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eih
      POSTGRES_PASSWORD: eih
      POSTGRES_DB: eih
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eih -d eih"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://eih:eih@db:5432/eih
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - eih_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  eih_storage:
